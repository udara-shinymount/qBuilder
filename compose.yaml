services:
  qbuilder-postgres:
    image: postgres:18
    container_name: qbuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qbuilder_app
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:54328:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d my_laravel_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_18_data:
